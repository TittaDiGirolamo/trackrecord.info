name: Auto Regenerate Tables

on:
  push:
    paths:
      - 'predictions_v2.jsonl'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pydantic

      - name: Run table generator
        run: python scripts/generate_prediction_tables.py

      - name: Generate prediction detail pages
        run: python scripts/generate_prediction_details.py

      - name: Generate homepage scorecards
        run: python scripts/generate_homepage_scorecards.py --build-date $(date +%Y-%m-%d) --index-html index.html

      - name: Generate forecaster profiles
        run: python scripts/generate_forecaster_profiles.py

      - name: Generate forecasters list
        run: python scripts/generate_forecasters_list.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html predictions.html predictions/ forecasters.html forecasters/
          git commit -m "chore: regenerate public HTML including phase0 event contract" || exit 0
          git push
